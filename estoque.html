<style>
  :root {
    --brand: #E63000; --brand-dark: #B32500;
    --bg: #F7F6F3; --surface: #FFFFFF; --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
    --text: #1A1A18; --text-muted: #6B6B67; --text-hint: #9E9E99;
    --green: #1D9E75; --green-bg: #E1F5EE; --green-text: #0F6E56;
    --red: #D85A30; --red-bg: #FAECE7; --red-text: #993C1D;
    --amber: #BA7517; --amber-bg: #FAEEDA; --amber-text: #854F0B;
    --blue: #185FA5; --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --radius: 10px; --radius-sm: 6px;
    --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  .header { background: var(--brand); border-bottom: none; padding: 0 1.25rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(230,48,0,0.25); }
  .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; color: white; display: flex; align-items: center; gap: 8px; }
  .logo span { color: rgba(255,255,255,0.75); font-weight: 300; }
  .main { max-width: 600px; margin: 0 auto; padding: 1.25rem; }
  .sbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 1rem; }
  .sbar.ok { background: var(--green-bg); color: var(--green-text); }
  .sbar.err { background: var(--red-bg); color: var(--red-text); }
  .sbar.info { background: var(--blue-bg); color: var(--blue-text); }
  .spinner { width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .filter-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  input, select { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0 10px; height: 38px; outline: none; }
  input:focus, select:focus { border-color: var(--text); }
  .estoque-grid { display: flex; flex-direction: column; gap: 8px; }
  .estoque-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .estoque-item.low { border-left: 3px solid var(--red); }
  .estoque-nome { flex: 1; font-size: 14px; font-weight: 500; }
  .estoque-unidade { font-size: 12px; color: var(--text-hint); }
  .estoque-qty { font-size: 20px; font-weight: 500; font-family: var(--mono); min-width: 80px; text-align: center; }
  .estoque-qty.low { color: var(--red); }
  .qty-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0; transition: all 0.15s; }
  .qty-btn.plus:hover, .qty-btn.plus:active { background: var(--brand); color: white; border-color: var(--brand); }
  .qty-btn.minus:hover, .qty-btn.minus:active { background: var(--red); color: white; border-color: var(--red); }
  .btn { height: 38px; padding: 0 18px; font-size: 14px; cursor: pointer; border-radius: var(--radius-sm); font-family: var(--font); font-weight: 500; border: none; }
  .btn-primary { background: var(--brand); color: white; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-ghost { background: none; border: 1px solid var(--border-strong); color: var(--text-muted); }
  .empty { text-align: center; padding: 3rem; color: var(--text-hint); font-size: 13px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 380px; }
  .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; }
  .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .form-group label { font-size: 12px; color: var(--text-muted); }
  .form-group input, .form-group select { width: 100%; }
  .modal-btns { display: flex; gap: 8px; margin-top: 1.25rem; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .b-rec { background: var(--green-bg); color: var(--green-text); }
  .b-av { background: var(--red-bg); color: var(--red-text); }
  .section-title { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 1.5rem 0 0.75rem; }
  .mov-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .mov-table th { font-size: 11px; color: var(--text-hint); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; }
  .mov-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .mov-table tr:last-child td { border-bottom: none; }

  .btn-comprar { background: #FFF1EC; color: var(--brand); border: 1px solid var(--brand); border-radius: var(--radius-sm); padding: 4px 10px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: var(--font); white-space: nowrap; flex-shrink: 0; }
  .btn-comprar:hover { background: var(--brand); color: white; }
  .compra-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  .compra-nome-text { font-size: 14px; font-weight: 500; }
  .compra-sub { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .compra-qty { font-size: 15px; font-weight: 500; font-family: var(--mono); color: var(--brand); min-width: 80px; text-align: right; }
  .btn-comprado { background: var(--green); color: white; border: none; border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font); }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">🔥 Estoque <span>Galeteria Express</span></div>
    <span style="font-size:12px;color:var(--text-hint);" id="ultima-atualizacao"></span>
  </div>
</div>

<div class="main">
  <div id="sb"></div>

  <div class="filter-row">
    <input type="text" id="busca" placeholder="Buscar item..." oninput="renderEstoque()" style="flex:1;" />
    <select id="filtro-rest" onchange="renderEstoque()">
      <option value="">Todos</option>
    </select>
  </div>

  <div id="estoque-lista" class="estoque-grid"></div>

  <div class="section-title">Minhas movimentações de hoje</div>
  <table class="mov-table">
    <thead><tr><th>Item</th><th>Motivo</th><th>Qtd</th></tr></thead>
    <tbody id="mov-hoje"></tbody>
  </table>
</div>

<!-- MODAL AJUSTE -->
<div class="modal-overlay" id="modal-ajuste">
  <div class="modal">
    <div class="modal-title" id="modal-title">Ajustar estoque</div>
    <input type="hidden" id="modal-item-id" />
    <input type="hidden" id="modal-tipo" />
    <div class="form-group">
      <label>Quantidade</label>
      <input type="number" id="modal-qty" step="0.01" min="0.01" placeholder="0" inputmode="decimal" />
    </div>
    <div class="form-group">
      <label>Motivo</label>
      <select id="modal-motivo"></select>
    </div>
    <div class="form-group" id="modal-rest-grupo">
      <label>Restaurante</label>
      <select id="modal-rest"></select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" style="flex:1;" onclick="confirmarAjuste()">Confirmar</button>
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

<div style="margin-top:1.5rem;">
  <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;">Minha lista de compras</div>
  <div id="lista-compras-func"></div>
</div>

<!-- MODAL COMPRAR -->
<div class="modal-overlay" id="modal-comprar">
  <div class="modal">
    <div class="modal-title" id="modal-comprar-title">Adicionar à lista</div>
    <input type="hidden" id="modal-comprar-item-id" />
    <div class="form-group" style="margin-bottom:10px;">
      <label>Quantidade necessária</label>
      <input type="text" id="modal-comprar-qty" inputmode="decimal" placeholder="0" style="width:100%;" />
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" style="flex:1;" onclick="confirmarComprar()">Adicionar</button>
      <button class="btn btn-ghost" onclick="fecharModal('modal-comprar')">Cancelar</button>
    </div>
  </div>
</div>

</div>

  {id:'p042',nome:'Cajuína 1L',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p043',nome:'Cajuína lata',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p044',nome:'Coca 1L',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p045',nome:'Coca lata',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p046',nome:'Coca Zero 1L',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p047',nome:'Coca Zero lata',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p048',nome:'Guaraná 1L',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p049',nome:'Guaraná lata',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'},
  {id:'p050',nome:'Guaraná Zero lata',unidade:'un',minimo:0,restaurante:'Seu Antonio Pizzaria',categoria:'Bebidas'}
];

let E = { itensEstoque: [], movimentacoes: [] };
let ajusteAtual = null;

function salvar() { try { localStorage.setItem(SK, JSON.stringify(E)); } catch(e) {} }
function carregar() {
  try {
    const d = localStorage.getItem(SK);
    if (d) { const p = JSON.parse(d); E = {...E, ...p}; }
  } catch(e) {}
  // Reset if items don't have categoria (old format) or are empty
  if (!E.itensEstoque || !E.itensEstoque.length || !E.itensEstoque[0].categoria) {
    E.itensEstoque = JSON.parse(JSON.stringify(ITENS_INICIAIS));
  }
  if (!E.movimentacoes) E.movimentacoes = [];
}

function showSB(msg, type) {
  const el = document.getElementById('sb');
  if (!msg) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="sbar ${type}">${type==='info'?'<div class="spinner"></div>':''} ${msg}</div>`;
}

function getQty(itemId, restaurante) {
  return E.movimentacoes
    .filter(m => m.itemId === itemId && (!restaurante || m.restaurante === restaurante))
    .reduce((s, m) => m.motivo === 'entrada' ? s + m.qty : s - m.qty, 0);
}

function renderEstoque() {
  const busca = (document.getElementById('busca').value || '').toLowerCase();
  const rest = document.getElementById('filtro-rest').value;
  let itens = E.itensEstoque || [];
  if (busca) itens = itens.filter(i => i.nome.toLowerCase().includes(busca));
  if (rest) itens = itens.filter(i => i.restaurante === rest);

  const el = document.getElementById('estoque-lista');
  if (!itens.length) { el.innerHTML = '<div class="empty">Nenhum item encontrado.</div>'; return; }

  // Group by categoria
  var grupos = {};
  for (var gi = 0; gi < itens.length; gi++) {
    var gItem = itens[gi];
    var gCat = gItem.categoria || 'Outros';
    if (!grupos[gCat]) grupos[gCat] = [];
    grupos[gCat].push(gItem);
  }

  var html = '';
  var catKeys = Object.keys(grupos).sort();
  for (var ci = 0; ci < catKeys.length; ci++) {
    var cat = catKeys[ci];
    var catHtml = '';
    var catItems = grupos[cat];
    for (var ii = 0; ii < catItems.length; ii++) {
      var item = catItems[ii];
      var qty = getQty(item.id, null);
      var isLow = item.minimo > 0 && qty <= item.minimo;
      var qtyDisplay = (qty % 1 === 0) ? String(Math.round(qty)) : qty.toFixed(2);
      var lowClass = isLow ? ' low' : '';
      catHtml += '<div class="estoque-item' + lowClass + '" id="est-' + item.id + '">';
      catHtml += '<button class="qty-btn minus" data-id="' + item.id + '" data-tipo="saida" onclick="abrirAjusteBtn(this)">−</button>';
      catHtml += '<div style="flex:1;padding:0 8px;">';
      catHtml += '<div class="estoque-nome">' + item.nome + '</div>';
      catHtml += '<div class="estoque-unidade">' + item.unidade + '</div>';
      catHtml += '</div>';
      catHtml += '<div class="estoque-qty' + lowClass + '" id="qty-' + item.id + '">' + qtyDisplay + ' <span style="font-size:12px;color:#9E9E99;font-weight:400;">' + item.unidade + '</span></div>';
      catHtml += '<button class="qty-btn plus" data-id="' + item.id + '" data-tipo="entrada" onclick="abrirAjusteBtn(this)">+</button>';
      catHtml += '<button class="btn-comprar" data-id="' + item.id + '" onclick="abrirComprarBtnFunc(this)">Comprar</button>';
      catHtml += '</div>';
    }
    html += '<div style="margin-bottom:1.25rem;">';
    html += '<div style="font-size:11px;font-weight:600;color:#9E9E99;text-transform:uppercase;letter-spacing:0.06em;padding:0 4px;margin-bottom:8px;">' + cat + '</div>';
    html += catHtml + '</div>';
  }
  el.innerHTML = html;;
}

function renderMovHoje() {
  const hoje = new Date().toISOString().slice(0,10);
  const movs = E.movimentacoes.filter(m => m.data === hoje).slice().reverse();
  const motivoLabel = {entrada:'Entrada', uso:'Uso', perda:'Perda', inventario:'Correção'};
  const tbody = document.getElementById('mov-hoje');
  if (!movs.length) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:1.5rem;color:var(--text-hint);">Nenhuma movimentação hoje.</td></tr>';
    return;
  }
  tbody.innerHTML = movs.map(m => {
    const item = (E.itensEstoque||[]).find(i => i.id === m.itemId);
    const isPos = m.motivo === 'entrada';
    const qtyDisplay = (m.qty % 1 === 0) ? String(Math.round(m.qty)) : m.qty.toFixed(2);
    return `<tr>
      <td>${item ? item.nome : m.itemId}</td>
      <td><span class="badge ${isPos?'b-rec':'b-av'}">${motivoLabel[m.motivo]||m.motivo}</span></td>
      <td style="font-weight:500;color:${isPos?'var(--green)':'var(--red)'};">${isPos?'+':'-'}${qtyDisplay} ${item?item.unidade:''}</td>
    </tr>`;
  }).join('');
}

function abrirAjuste(itemId, tipo) {
  const item = (E.itensEstoque||[]).find(i => i.id === itemId);
  if (!item) return;
  ajusteAtual = { itemId, tipo };

  document.getElementById('modal-title').textContent = tipo === 'entrada' ? `Entrada — ${item.nome}` : `Saída — ${item.nome}`;
  document.getElementById('modal-qty').value = '';

  const selMotivo = document.getElementById('modal-motivo');
  if (tipo === 'entrada') {
    selMotivo.innerHTML = '<option value="entrada">Entrada (compra/recebimento)</option>';
  } else {
    selMotivo.innerHTML = `
      <option value="uso">Uso na produção</option>
      <option value="perda">Perda / descarte</option>
      <option value="inventario">Correção</option>`;
  }

  const selRest = document.getElementById('modal-rest');
  selRest.innerHTML = RESTAURANTES.map(r => `<option value="${r}">${r}</option>`).join('');

  document.getElementById('modal-ajuste').classList.add('open');
  setTimeout(() => document.getElementById('modal-qty').focus(), 150);
}

function fecharModal() {
  document.getElementById('modal-ajuste').classList.remove('open');
}

async function confirmarAjuste() {
  const qty = parseFloat(document.getElementById('modal-qty').value);
  const motivo = document.getElementById('modal-motivo').value;
  const rest = document.getElementById('modal-rest').value;
  if (isNaN(qty) || qty <= 0) { alert('Informe uma quantidade válida.'); return; }

  const mov = {
    id: Date.now(),
    itemId: ajusteAtual.itemId,
    restaurante: rest,
    motivo,
    qty,
    data: new Date().toISOString().slice(0,10),
    timestamp: new Date().toISOString(),
    sheet: 'movimentacoes'
  };

  showSB('Salvando...', 'info');
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(mov) });
    await res.json();
    E.movimentacoes.push(mov);
    salvar();
    fecharModal();

    // Atualiza qty na tela
    const novaQty = getQty(mov.itemId, null);
    const qtyEl = document.getElementById('qty-' + mov.itemId);
    if (qtyEl) {
      const itemAtual = (E.itensEstoque||[]).find(i => i.id === mov.itemId);
      const qd = (novaQty % 1 === 0) ? String(Math.round(novaQty)) : novaQty.toFixed(2);
      qtyEl.innerHTML = qd + ' <span style="font-size:12px;color:var(--text-hint);font-weight:400;">' + (itemAtual?itemAtual.unidade:'') + '</span>';
    }
    renderMovHoje();
    showSB('Salvo!', 'ok');
    setTimeout(() => showSB('',''), 2000);
  } catch(e) {
    showSB('Erro: ' + e.message, 'err');
  }
}

function populateRests() {
  const sel = document.getElementById('filtro-rest');
  sel.innerHTML = '<option value="">Todos</option>' + RESTAURANTES.map(r => `<option value="${r}">${r}</option>`).join('');
}

async function sincronizar() {
  try {
    const res = await fetch(SCRIPT_URL + '?sheet=movimentacoes&t=' + Date.now());
    const data = await res.json();
    if (data.rows && data.rows.length > 1) {
      E.movimentacoes = data.rows.slice(1).filter(r => r[0]).map(r => ({
        id: parseInt(r[0]),
        itemId: String(r[1]),
        restaurante: String(r[2]),
        motivo: String(r[3]),
        qty: parseFloat(r[4]),
        data: String(r[5]).slice(0,10)
      }));
      salvar();
      renderEstoque();
      renderMovHoje();
    }
    const agora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    document.getElementById('ultima-atualizacao').textContent = 'Atualizado às ' + agora;
  } catch(e) {
    console.log('Erro sincronizar:', e.message);
  }
}


function abrirAjusteBtn(btn) {
  var id = btn.getAttribute('data-id');
  var tipo = btn.getAttribute('data-tipo');
  abrirAjuste(id, tipo);
}


function abrirComprarBtnFunc(btn) {
  var id = btn.getAttribute('data-id');
  var item = (E.itensEstoque||[]).find(function(i) { return i.id === id; });
  if (!item) return;
  document.getElementById('modal-comprar-title').textContent = 'Comprar — ' + item.nome;
  document.getElementById('modal-comprar-item-id').value = id;
  document.getElementById('modal-comprar-qty').value = '';
  document.getElementById('modal-comprar').classList.add('open');
  setTimeout(function() { document.getElementById('modal-comprar-qty').focus(); }, 100);
}

async function confirmarComprar() {
  var itemId = document.getElementById('modal-comprar-item-id').value;
  var qty = parseFloat(String(document.getElementById('modal-comprar-qty').value).replace(',','.'));
  if (!qty || qty <= 0) { alert('Informe a quantidade.'); return; }
  var item = (E.itensEstoque||[]).find(function(i) { return i.id === itemId; });
  if (!item) return;
  var rest = document.getElementById('filtro-rest').value || item.restaurante;
  var compra = {
    id: Date.now(), itemId: itemId, nomeItem: item.nome,
    unidade: item.unidade, categoria: item.categoria || '',
    restaurante: rest, qty: qty,
    data: new Date().toISOString().slice(0,10), comprado: false
  };
  if (!E.listaCompras) E.listaCompras = [];
  E.listaCompras.push(compra);
  salvar();
  fecharModal('modal-comprar');
  renderComprasFunc();
  try {
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({...compra, sheet: 'compras'}) });
  } catch(e) {}
}

async function marcarComprado(id) {
  if (!confirm('Marcar como comprado?')) return;
  E.listaCompras = (E.listaCompras||[]).filter(function(c) { return c.id !== id; });
  salvar();
  renderComprasFunc();
  try {
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action:'delete', sheet:'compras', id}) });
  } catch(e) {}
}

function renderComprasFunc() {
  var el = document.getElementById('lista-compras-func');
  if (!el) return;
  var itens = (E.listaCompras||[]).filter(function(c) { return !c.comprado; });
  if (!itens.length) { el.innerHTML = '<div style="text-align:center;padding:1rem;color:#9E9E99;font-size:13px;">Nenhum item na lista.</div>'; return; }
  var html = itens.map(function(c) {
    var qd = (c.qty % 1 === 0) ? String(Math.round(c.qty)) : c.qty.toFixed(2);
    return '<div class="compra-item">' +
      '<div style="flex:1;"><div class="compra-nome-text">' + c.nomeItem + '</div><div class="compra-sub">' + c.restaurante + '</div></div>' +
      '<div class="compra-qty">' + qd + ' ' + c.unidade + '</div>' +
      '<button class="btn-comprado" onclick="marcarComprado(' + c.id + ')">✓</button>' +
    '</div>';
  }).join('');
  el.innerHTML = html;
}

function init() {
  carregar();
  populateRests();
  renderEstoque();
  renderMovHoje();
  if (!E.listaCompras) E.listaCompras = [];
  renderComprasFunc();
  sincronizar();
  setInterval(sincronizar, 2 * 60 * 1000);
}

init();
</script>
</body>
</html>
