<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestão Financeira — Restaurantes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --text: #1A1A18;
    --text-muted: #6B6B67;
    --text-hint: #9E9E99;
    --green: #1D9E75;
    --green-bg: #E1F5EE;
    --green-text: #0F6E56;
    --red: #D85A30;
    --red-bg: #FAECE7;
    --red-text: #993C1D;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
    --amber-text: #854F0B;
    --blue: #185FA5;
    --blue-bg: #E6F1FB;
    --blue-text: #0C447C;
    --purple-bg: #EEEDFE;
    --purple-text: #3C3489;
    --radius: 10px;
    --radius-sm: 6px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .logo { font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
  .logo span { color: var(--text-muted); font-weight: 300; }
  .sync-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; background: none; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 12px; font-family: var(--font); transition: all 0.15s; }
  .sync-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg); }

  .tabs-bar { background: var(--surface); border-bottom: 1px solid var(--border); }
  .tabs-inner { max-width: 760px; margin: 0 auto; display: flex; padding: 0 1.5rem; }
  .tab { padding: 12px 16px; font-size: 13px; font-weight: 400; color: var(--text-muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font); transition: all 0.15s; }
  .tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }

  .main { max-width: 760px; margin: 0 auto; padding: 1.5rem; }
  .panel { display: none; }
  .panel.active { display: block; }

  .status-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 1.25rem; }
  .status-bar.ok { background: var(--green-bg); color: var(--green-text); }
  .status-bar.err { background: var(--red-bg); color: var(--red-text); }
  .status-bar.info { background: var(--blue-bg); color: var(--blue-text); }
  .spinner { width: 13px; height: 13px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 11px; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .metric-value { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-value.amber { color: var(--amber); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  input, select, textarea { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0 10px; height: 38px; width: 100%; outline: none; transition: border-color 0.15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--text); }
  textarea { height: auto; padding: 10px; resize: none; }
  input[type="month"] { height: 38px; }

  .toggle-group { display: flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; height: 38px; }
  .toggle-btn { flex: 1; border: none; background: none; font-size: 13px; cursor: pointer; color: var(--text-muted); font-family: var(--font); transition: all 0.15s; }
  .toggle-btn.active { background: var(--text); color: white; font-weight: 500; }

  .btn { height: 38px; padding: 0 18px; font-size: 14px; cursor: pointer; border-radius: var(--radius-sm); font-family: var(--font); font-weight: 500; transition: all 0.15s; }
  .btn-primary { background: var(--text); color: white; border: none; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { background: none; border: 1px solid var(--border-strong); color: var(--text-muted); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }
  .btn-danger { background: none; border: none; color: var(--red); font-size: 12px; cursor: pointer; padding: 2px 6px; font-family: var(--font); opacity: 0.7; }
  .btn-danger:hover { opacity: 1; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .b-rec { background: var(--green-bg); color: var(--green-text); }
  .b-av { background: var(--red-bg); color: var(--red-text); }
  .b-ca { background: var(--amber-bg); color: var(--amber-text); }
  .b-cp { background: var(--purple-bg); color: var(--purple-text); }
  .b-desp { background: #FCEBEB; color: #A32D2D; }
  .ptag { font-size: 10px; background: var(--purple-bg); color: var(--purple-text); padding: 1px 6px; border-radius: 20px; margin-left: 4px; }

  .item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 6px; }
  .item .desc { flex: 1; }
  .item .desc-main { font-size: 13px; color: var(--text); }
  .item .desc-sub { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .item .val { font-weight: 500; min-width: 100px; text-align: right; font-size: 13px; font-family: var(--mono); }
  .val.green { color: var(--green); }
  .val.red { color: var(--red); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { height: 34px; font-size: 13px; width: auto; }

  .dre-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dre-table th { font-size: 11px; font-weight: 500; color: var(--text-hint); text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; }
  .dre-table th.r { text-align: right; }
  .dre-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  .dre-table td.r { text-align: right; font-family: var(--mono); }
  .dre-table .tot td { font-weight: 500; background: var(--bg); }
  .dre-table .gh td { font-size: 10px; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 16px; padding-bottom: 4px; border-bottom: none; }
  .dre-table .sub td { font-weight: 500; }
  .dre-table .ind td:first-child { padding-left: 24px; color: var(--text-muted); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text-hint); font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13px; margin: 3px; }
  .ibox { background: var(--blue-bg); border-left: 3px solid var(--blue); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 10px 14px; font-size: 13px; color: var(--blue-text); margin-bottom: 1rem; }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .section-header h3 { font-size: 13px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  @media (max-width: 600px) {
    .main { padding: 1rem; }
    .form-row { grid-template-columns: 1fr; }
    .metric-grid { grid-template-columns: 1fr 1fr; }
    .header-inner { padding: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">Gestão <span>Restaurantes</span></div>
    <button class="sync-btn" onclick="sincronizar()">
      <span id="sync-icon">↻</span> Sincronizar
    </button>
  </div>
</div>

<div class="tabs-bar">
  <div class="tabs-inner">
    <button class="tab active" onclick="setTab('lancar')">Lançar</button>
    <button class="tab" onclick="setTab('historico')">Histórico</button>
    <button class="tab" onclick="setTab('dre')">DRE</button>
    <button class="tab" onclick="setTab('config')">Config</button>
  </div>
</div>

<div class="main">
  <div id="sb"></div>

  <!-- LANÇAR -->
  <div id="panel-lancar" class="panel active">
    <div id="metricas" class="metric-grid"></div>
    <div class="card">
      <div class="card-title">Novo lançamento</div>
      <div class="form-row">
        <div class="form-group">
          <label>Tipo</label>
          <div class="toggle-group">
            <button class="toggle-btn active" id="t-rec" onclick="setTipo('receita')">Receita</button>
            <button class="toggle-btn" id="t-desp" onclick="setTipo('despesa')">Despesa / Compra</button>
          </div>
        </div>
        <div class="form-group" id="g-mod" style="display:none;">
          <label>Modalidade</label>
          <select id="modalidade" onchange="onMod()">
            <option value="avista">À vista / Pix</option>
            <option value="cartao_mes">Cartão — fatura este mês</option>
            <option value="cartao_prox">Cartão — fatura próximo mês</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Restaurante</label>
          <select id="restaurante"></select>
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="data" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label id="lbl-cat">Categoria</label>
          <select id="categoria"></select>
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" id="valor" placeholder="0,00" min="0" step="0.01" />
        </div>
      </div>
      <div class="form-row" id="g-ref" style="display:none;">
        <div class="form-group">
          <label>Mês de referência (CMV) <span class="ptag">CMV</span></label>
          <input type="month" id="mes-ref" />
        </div>
        <div class="form-group">
          <label>Previsão de cobrança</label>
          <input type="month" id="mes-cob" />
        </div>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>Descrição</label>
        <textarea id="descricao" rows="2" placeholder="Ex: Compra de camarão — Fornecedor X"></textarea>
      </div>
      <button class="btn btn-primary" id="btn-lancar" onclick="lancar()" style="width:100%;">Registrar lançamento</button>
    </div>
    <div class="card">
      <div class="card-title">Lançamentos de hoje</div>
      <div id="lista-hoje"></div>
    </div>
  </div>

  <!-- HISTÓRICO -->
  <div id="panel-historico" class="panel">
    <div class="filter-row">
      <select id="f-rest" onchange="renderHist()"><option value="">Todos os restaurantes</option></select>
      <select id="f-tipo" onchange="renderHist()">
        <option value="">Todos os tipos</option>
        <option value="receita">Receita</option>
        <option value="compra_avista">Compra à vista</option>
        <option value="compra_cartao">Cartão (este mês)</option>
        <option value="compra_cartao_prox">Cartão (próx. mês)</option>
        <option value="despesa">Despesa operacional</option>
      </select>
      <input type="month" id="f-mes" onchange="renderHist()" style="height:34px;font-size:13px;" />
    </div>
    <div class="card" style="padding:0.75rem;">
      <div id="lista-hist" style="max-height:520px;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- DRE -->
  <div id="panel-dre" class="panel">
    <div class="filter-row">
      <select id="dre-rest" onchange="renderDRE()"><option value="">Consolidado (todos)</option></select>
      <input type="month" id="dre-mes" onchange="renderDRE()" style="height:34px;font-size:13px;" />
    </div>
    <div class="ibox">Compras no cartão com fatura no próximo mês são <strong>incluídas no CMV do mês de referência</strong>, mas sinalizadas como sem saída de caixa no período.</div>
    <div id="dre-content"></div>
  </div>

  <!-- CONFIG -->
  <div id="panel-config" class="panel">
    <div class="card">
      <div class="card-title">Restaurantes</div>
      <div id="lista-rests" style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;"></div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="novo-rest" placeholder="Nome do restaurante" style="flex:1;" />
        <button class="btn btn-primary" onclick="addRest()">Adicionar</button>
      </div>
    </div>
    <div class="card">
      <div class="section-header">
        <h3>Categorias</h3>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost" style="font-size:12px;height:32px;" id="et-rec" onclick="setET('receita')">Receita</button>
          <button class="btn btn-ghost" style="font-size:12px;height:32px;" id="et-desp" onclick="setET('despesa')">Despesa/Compra</button>
        </div>
      </div>
      <div id="lista-cats" style="display:flex;flex-wrap:wrap;margin-bottom:14px;"></div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="nova-cat" placeholder="Nova categoria" style="flex:1;" />
        <button class="btn btn-primary" onclick="addCat()">Adicionar</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Conexão</div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Script Google Apps conectado e ativo.</p>
      <button class="btn btn-ghost" onclick="sincronizar()">↻ Sincronizar planilha agora</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwC8GD9Zh222I00EmO9qlu7u0URGsQm_xSyWkoSqBKb6hcctrHnjwYSh_gBcIEzGc1E/exec';
const SK = 'gest_rest_v4';

let E = {
  tipo: 'receita',
  editTipo: 'receita',
  restaurantes: ['Galeteria Express', 'Seu Antonio Pizzaria'],
  categorias: {
    receita: ['Venda no cartão', 'Venda no pix', 'Venda no dinheiro', 'Repasse Ifood', 'Outros'],
    despesa: ['Carnes e proteínas', 'Hortifruti', 'Bebidas', 'Secos e laticínios', 'Descartáveis', 'Folha de pagamento', 'Aluguel', 'Energia e água', 'Manutenção', 'Marketing', 'Outros']
  },
  lancamentos: []
};

function fmt(v) {
  return 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function salvar() {
  try { localStorage.setItem(SK, JSON.stringify(E)); } catch(e) {}
}

function carregar() {
  try {
    const d = localStorage.getItem(SK);
    if (d) E = { ...E, ...JSON.parse(d) };
  } catch(e) {}
}

function sb(msg, type) {
  const el = document.getElementById('sb');
  if (!msg) { el.innerHTML = ''; return; }
  const spin = type === 'info' ? '<div class="spinner"></div>' : '';
  el.innerHTML = `<div class="status-bar ${type}">${spin} ${msg}</div>`;
}

async function enviarParaSheets(lanc) {
  const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(lanc) });
  const data = await res.json();
  if (!data.ok) throw new Error('Erro no script');
}

async function sincronizar() {
  const icon = document.getElementById('sync-icon');
  icon.style.animation = 'spin 0.7s linear infinite';
  sb('Sincronizando com a planilha...', 'info');
  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    if (data.rows && data.rows.length > 1) {
      E.lancamentos = data.rows.slice(1).filter(r => r[0]).map(r => ({
        id: parseInt(r[0]),
        data: String(r[1]).slice(0,10),
        restaurante: String(r[2]),
        tipo: String(r[3]),
        subTipo: String(r[4]),
        categoria: String(r[5]),
        descricao: String(r[6]),
        valor: parseFloat(r[7]),
        mesRef: String(r[8]).slice(0,7),
        mesCob: String(r[9]).slice(0,7)
      }));
      salvar();
    }
    sb('Planilha sincronizada com sucesso!', 'ok');
    setTimeout(() => sb('', ''), 3000);
    renderAll();
  } catch(e) {
    sb('Erro ao sincronizar: ' + e.message, 'err');
  }
  icon.style.animation = '';
}

function setTab(t) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
  document.querySelector(`[onclick="setTab('${t}')"]`).classList.add('active');
  document.getElementById('panel-' + t).classList.add('active');
}

function setTipo(t) {
  E.tipo = t;
  document.getElementById('t-rec').classList.toggle('active', t === 'receita');
  document.getElementById('t-desp').classList.toggle('active', t !== 'receita');
  document.getElementById('g-mod').style.display = t === 'despesa' ? '' : 'none';
  document.getElementById('g-ref').style.display = 'none';
  document.getElementById('lbl-cat').textContent = t === 'receita' ? 'Categoria' : 'Categoria';
  populateCats();
}

function onMod() {
  document.getElementById('g-ref').style.display =
    document.getElementById('modalidade').value === 'cartao_prox' ? '' : 'none';
}

function populateRests() {
  ['restaurante','f-rest','dre-rest'].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    const val = el.value;
    const isF = id !== 'restaurante';
    el.innerHTML = isF ? '<option value="">Todos os restaurantes</option>' : '';
    E.restaurantes.forEach(r => el.innerHTML += `<option value="${r}">${r}</option>`);
    if (val) el.value = val;
  });
}

function populateCats() {
  const sel = document.getElementById('categoria');
  const cats = E.tipo === 'receita' ? E.categorias.receita : E.categorias.despesa;
  sel.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function bClass(s) {
  if (s==='receita') return 'b-rec';
  if (s==='compra_avista') return 'b-av';
  if (s==='compra_cartao') return 'b-ca';
  if (s==='compra_cartao_prox') return 'b-cp';
  return 'b-desp';
}

function bLabel(s) {
  if (s==='receita') return 'Receita';
  if (s==='compra_avista') return 'À vista';
  if (s==='compra_cartao') return 'Cartão (este mês)';
  if (s==='compra_cartao_prox') return 'Cartão (próx. mês)';
  return 'Despesa';
}

function itemHTML(l, showDate) {
  const date = showDate ? `<div style="font-size:11px;color:var(--text-hint);">${l.data.split('-').reverse().join('/')}</div>` : '';
  return `<div class="item">
    <div style="min-width:${showDate?'90px':'auto'};">
      ${date}
      <span class="badge ${bClass(l.subTipo)}">${bLabel(l.subTipo)}</span>
    </div>
    <div class="desc">
      <div class="desc-main">${l.descricao || l.categoria}</div>
      <div class="desc-sub">${l.restaurante} · ${l.categoria}</div>
    </div>
    <div class="val ${l.tipo==='receita'?'green':'red'}">${l.tipo==='receita'?'+':'-'} ${fmt(l.valor)}</div>
    <button class="btn-danger" onclick="deletar(${l.id})">✕</button>
  </div>`;
}

async function lancar() {
  const rest = document.getElementById('restaurante').value;
  const data = document.getElementById('data').value;
  const cat = document.getElementById('categoria').value;
  const valor = parseFloat(document.getElementById('valor').value);
  const desc = document.getElementById('descricao').value.trim();
  const mod = document.getElementById('modalidade').value;
  const mesRef = document.getElementById('mes-ref').value;
  const mesCob = document.getElementById('mes-cob').value;

  if (!rest || !data || !cat || isNaN(valor) || valor <= 0) {
    alert('Preencha todos os campos obrigatórios.');
    return;
  }

  let subTipo = E.tipo;
  if (E.tipo === 'despesa') {
    if (mod === 'avista') subTipo = 'compra_avista';
    else if (mod === 'cartao_mes') subTipo = 'compra_cartao';
    else subTipo = 'compra_cartao_prox';
  }

  const lanc = {
    id: Date.now(), restaurante: rest, data, categoria: cat, valor,
    descricao: desc, tipo: E.tipo, subTipo,
    mesRef: subTipo === 'compra_cartao_prox' ? (mesRef || data.slice(0,7)) : data.slice(0,7),
    mesCob: subTipo === 'compra_cartao_prox' ? mesCob : data.slice(0,7)
  };

  const btn = document.getElementById('btn-lancar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  sb('Salvando na planilha...', 'info');

  try {
    await enviarParaSheets(lanc);
    E.lancamentos.push(lanc);
    salvar();
    sb('Lançamento salvo na planilha!', 'ok');
    setTimeout(() => sb('', ''), 3000);
    document.getElementById('valor').value = '';
    document.getElementById('descricao').value = '';
    renderAll();
  } catch(e) {
    sb('Erro ao salvar: ' + e.message, 'err');
  }
  btn.disabled = false; btn.textContent = 'Registrar lançamento';
}

async function deletar(id) {
  if (!confirm('Excluir este lançamento?')) return;
  sb('Excluindo...', 'info');
  try {
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id }) });
    E.lancamentos = E.lancamentos.filter(l => l.id !== id);
    salvar();
    sb('Excluído com sucesso!', 'ok');
    setTimeout(() => sb('', ''), 2000);
    renderAll();
  } catch(e) { sb('Erro: ' + e.message, 'err'); }
}

function renderMetricas() {
  const mes = new Date().toISOString().slice(0,7);
  const d = E.lancamentos.filter(l => l.mesRef === mes);
  const rec = d.filter(l=>l.tipo==='receita').reduce((s,l)=>s+l.valor,0);
  const cmv = d.filter(l=>['compra_avista','compra_cartao','compra_cartao_prox'].includes(l.subTipo)).reduce((s,l)=>s+l.valor,0);
  const desp = d.filter(l=>l.tipo==='despesa'&&!['compra_avista','compra_cartao','compra_cartao_prox'].includes(l.subTipo)).reduce((s,l)=>s+l.valor,0);
  const res = rec - cmv - desp;
  const pct = rec > 0 ? cmv/rec*100 : 0;
  document.getElementById('metricas').innerHTML = `
    <div class="metric"><div class="metric-label">Receita do mês</div><div class="metric-value green">${fmt(rec)}</div></div>
    <div class="metric"><div class="metric-label">CMV do mês</div><div class="metric-value amber">${fmt(cmv)}</div></div>
    <div class="metric"><div class="metric-label">CMV %</div><div class="metric-value ${pct>35?'red':'amber'}">${pct.toFixed(1)}%</div></div>
    <div class="metric"><div class="metric-label">Resultado</div><div class="metric-value ${res>=0?'green':'red'}">${fmt(res)}</div></div>`;
}

function renderHoje() {
  const hoje = new Date().toISOString().slice(0,10);
  const itens = E.lancamentos.filter(l=>l.data===hoje).slice().reverse();
  const el = document.getElementById('lista-hoje');
  el.innerHTML = itens.length ? itens.map(l => itemHTML(l, false)).join('') : '<div class="empty">Nenhum lançamento hoje ainda.</div>';
}

function renderHist() {
  const fR = document.getElementById('f-rest').value;
  const fT = document.getElementById('f-tipo').value;
  const fM = document.getElementById('f-mes').value;
  let itens = E.lancamentos.slice().reverse();
  if (fR) itens = itens.filter(l=>l.restaurante===fR);
  if (fT) itens = itens.filter(l=>l.subTipo===fT);
  if (fM) itens = itens.filter(l=>l.data.startsWith(fM));
  const el = document.getElementById('lista-hist');
  el.innerHTML = itens.length ? itens.map(l => itemHTML(l, true)).join('') : '<div class="empty">Nenhum lançamento encontrado.</div>';
}

function renderDRE() {
  const fR = document.getElementById('dre-rest').value;
  const fM = document.getElementById('dre-mes').value;
  const itens = E.lancamentos.filter(l=>(fM?l.mesRef===fM:true)&&(fR?l.restaurante===fR:true));
  if (!itens.length) { document.getElementById('dre-content').innerHTML = '<div class="empty">Nenhum lançamento para o período.</div>'; return; }

  const catRec = [...new Set(itens.filter(l=>l.tipo==='receita').map(l=>l.categoria))];
  const catDesp = [...new Set(itens.filter(l=>l.tipo==='despesa'&&!['compra_avista','compra_cartao','compra_cartao_prox'].includes(l.subTipo)).map(l=>l.categoria))];
  const totalRec = catRec.reduce((s,c)=>s+itens.filter(l=>l.tipo==='receita'&&l.categoria===c).reduce((a,l)=>a+l.valor,0),0);
  const cmvAv = itens.filter(l=>l.subTipo==='compra_avista').reduce((s,l)=>s+l.valor,0);
  const cmvCa = itens.filter(l=>l.subTipo==='compra_cartao').reduce((s,l)=>s+l.valor,0);
  const cmvCp = itens.filter(l=>l.subTipo==='compra_cartao_prox').reduce((s,l)=>s+l.valor,0);
  const totalCMV = cmvAv+cmvCa+cmvCp;
  const lb = totalRec - totalCMV;
  const cmvP = totalRec>0 ? totalCMV/totalRec*100 : 0;
  const totalDesp = catDesp.reduce((s,c)=>s+itens.filter(l=>l.tipo==='despesa'&&l.categoria===c).reduce((a,l)=>a+l.valor,0),0);
  const res = lb - totalDesp;
  const resP = totalRec>0 ? res/totalRec*100 : 0;
  const pct = v => totalRec>0 ? `${(v/totalRec*100).toFixed(1)}%` : '-';

  document.getElementById('dre-content').innerHTML = `
    <div class="card" style="padding:0.5rem 0; overflow-x:auto;">
      <table class="dre-table">
        <thead><tr><th>Descrição</th><th class="r">Obs</th><th class="r">Valor</th><th class="r">% Rec.</th></tr></thead>
        <tbody>
          <tr class="gh"><td colspan="4">Receitas</td></tr>
          ${catRec.map(c=>{const v=itens.filter(l=>l.tipo==='receita'&&l.categoria===c).reduce((a,l)=>a+l.valor,0);return`<tr class="ind"><td>${c}</td><td class="r"></td><td class="r" style="color:var(--green);">${fmt(v)}</td><td class="r" style="color:var(--text-hint);font-size:12px;">${pct(v)}</td></tr>`;}).join('')}
          <tr class="sub"><td>Receita total</td><td class="r"></td><td class="r" style="color:var(--green);">${fmt(totalRec)}</td><td class="r">100%</td></tr>
          <tr class="gh"><td colspan="4">CMV — custo das mercadorias</td></tr>
          <tr class="ind"><td>Compras à vista / pix</td><td class="r" style="font-size:11px;color:var(--text-hint);">Caixa</td><td class="r" style="color:var(--red);">(${fmt(cmvAv)})</td><td class="r" style="font-size:12px;color:var(--text-hint);">${pct(cmvAv)}</td></tr>
          <tr class="ind"><td>Cartão — este mês</td><td class="r" style="font-size:11px;color:var(--text-hint);">Caixa</td><td class="r" style="color:var(--red);">(${fmt(cmvCa)})</td><td class="r" style="font-size:12px;color:var(--text-hint);">${pct(cmvCa)}</td></tr>
          <tr class="ind"><td>Cartão — próx. mês <span class="ptag">competência</span></td><td class="r" style="font-size:11px;color:var(--text-hint);">Sem saída caixa</td><td class="r" style="color:var(--red);">(${fmt(cmvCp)})</td><td class="r" style="font-size:12px;color:var(--text-hint);">${pct(cmvCp)}</td></tr>
          <tr class="sub"><td>CMV total</td><td class="r" style="font-size:12px;color:var(--text-hint);">${cmvP.toFixed(1)}%</td><td class="r" style="color:var(--red);">(${fmt(totalCMV)})</td><td class="r" style="color:var(--red);">${cmvP.toFixed(1)}%</td></tr>
          <tr class="tot"><td>Lucro bruto</td><td class="r"></td><td class="r" style="color:${lb>=0?'var(--green)':'var(--red)'};">${fmt(lb)}</td><td class="r">${totalRec>0?(lb/totalRec*100).toFixed(1)+'%':'-'}</td></tr>
          <tr class="gh"><td colspan="4">Despesas operacionais</td></tr>
          ${catDesp.map(c=>{const v=itens.filter(l=>l.tipo==='despesa'&&l.categoria===c).reduce((a,l)=>a+l.valor,0);return`<tr class="ind"><td>${c}</td><td class="r"></td><td class="r" style="color:var(--red);">(${fmt(v)})</td><td class="r" style="font-size:12px;color:var(--text-hint);">${pct(v)}</td></tr>`;}).join('')}
          <tr class="sub"><td>Total despesas</td><td class="r"></td><td class="r" style="color:var(--red);">(${fmt(totalDesp)})</td><td class="r" style="color:var(--text-hint);font-size:12px;">${pct(totalDesp)}</td></tr>
          <tr class="tot" style="border-top:2px solid var(--border-strong);">
            <td style="font-size:15px;font-weight:500;">Resultado líquido</td>
            <td class="r" style="font-size:12px;color:var(--text-hint);">${resP.toFixed(1)}% da receita</td>
            <td class="r" style="font-size:16px;font-weight:500;color:${res>=0?'var(--green)':'var(--red)'};">${fmt(res)}</td>
            <td class="r" style="font-weight:500;color:${res>=0?'var(--green)':'var(--red)'};">${resP.toFixed(1)}%</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

function renderConfig() {
  document.getElementById('lista-rests').innerHTML = E.restaurantes.map(r=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg);border-radius:var(--radius-sm);font-size:13px;">
      <span>${r}</span><button class="btn-danger" onclick="remRest('${r}')">✕ Remover</button>
    </div>`).join('');
  document.getElementById('lista-cats').innerHTML = E.categorias[E.editTipo].map(c=>`
    <span class="chip">${c}<button class="btn-danger" style="padding:0;font-size:11px;" onclick="remCat('${c}')">✕</button></span>`).join('');
  ['et-rec','et-desp'].forEach(id => {
    const t = id === 'et-rec' ? 'receita' : 'despesa';
    const active = E.editTipo === t;
    document.getElementById(id).style.background = active ? 'var(--text)' : '';
    document.getElementById(id).style.color = active ? 'white' : '';
    document.getElementById(id).style.borderColor = active ? 'var(--text)' : '';
  });
}

function setET(t) { E.editTipo = t; renderConfig(); }

function addRest() {
  const v = document.getElementById('novo-rest').value.trim();
  if (!v || E.restaurantes.includes(v)) return;
  E.restaurantes.push(v); salvar();
  document.getElementById('novo-rest').value = '';
  populateRests(); renderConfig();
}

function remRest(r) {
  if (!confirm(`Remover "${r}"?`)) return;
  E.restaurantes = E.restaurantes.filter(x=>x!==r); salvar();
  populateRests(); renderConfig();
}

function addCat() {
  const v = document.getElementById('nova-cat').value.trim();
  if (!v) return;
  if (!E.categorias[E.editTipo].includes(v)) { E.categorias[E.editTipo].push(v); salvar(); }
  document.getElementById('nova-cat').value = '';
  populateCats(); renderConfig();
}

function remCat(c) {
  E.categorias[E.editTipo] = E.categorias[E.editTipo].filter(x=>x!==c); salvar();
  populateCats(); renderConfig();
}

function renderAll() {
  renderMetricas();
  renderHoje();
  renderHist();
  renderDRE();
  renderConfig();
}

function init() {
  carregar();
  const hoje = new Date().toISOString().slice(0,10);
  const mes = hoje.slice(0,7);
  document.getElementById('data').value = hoje;
  document.getElementById('f-mes').value = mes;
  document.getElementById('dre-mes').value = mes;
  document.getElementById('mes-ref').value = mes;
  const pm = new Date(); pm.setMonth(pm.getMonth()+1);
  document.getElementById('mes-cob').value = pm.toISOString().slice(0,7);
  setTipo('receita');
  populateRests();
  populateCats();
  renderAll();
  sincronizar();
  setInterval(sincronizar, 5 * 60 * 1000);
}

init();
</script>
</body>
</html>
